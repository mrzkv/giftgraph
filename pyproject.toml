[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-gift-graph"
version = "0.1.0"
description = "Depth-limited graph of publicly visible Telegram gifts"
requires-python = ">=3.11"
dependencies = ["kurigram>=2.2.27,<3", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
qr = ["kurigram[qrcode]>=2.2.27,<3"]

[project.scripts]
giftgraph = "giftgraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/giftgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
